openapi: 3.0.3
info:
  title: Projeto Locadora Senai - Edvan Alves
  description: |-
   API para registro e consulta de filmes
  termsOfService: http://swagger.io/terms/
  contact:
    email: edvan.aoliveira324@gmail.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
servers:
  - url: https://github.com/EdvanOAlves/BEND_06-API-Locadora
paths:
  /v1/locadora/filme:
    get:
      tags:
        - filme
      summary: Lista todos os filmes
      description: Listagem de todos os registros de filmes no banco de dados
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Filme'          
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
    post:
      tags:
        - filme
      summary: Cadastro de filme
      description: Adiciona um novo registro de filme no banco de dados
      requestBody:
        description: JSON contendo os dados do filme a ser registrado no sistema
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Filme'
        required: true
      responses:
        '201':
          description: Item Successfully Created
        '400':
          description: Invalid Input
        '415':
          description: Unsuported Media Type
        '500':
          description: Internal Server Error
          
  /v1/locadora/filme/{id}:
    get:
      tags:
        - filme
      summary: Busca um filme pelo ID
      description: Realiza uma busca no BD por um registro de filme com id igual ao solicitado
      parameters:
        - name: id
          in: path
          description: Id do registro a ser consultado
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Filme'          
        '400':
          description: Invalid Input
        '404':
          description: Not Found
        '500': 
          description: Internal Server Error
    put:
      tags:
        - filme
      summary: Atualiza um filme existente
      description: Atualiza os dados do registro de um filme no banco de dados correspondente ao Id
      parameters:
        - name: id
          in: path
          description: Id do registro a ser alterado
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: atualiza um filme existente
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Filme'
        required: true
      responses:
        '200':
          description: Successful Operation
        '404':
          description: Not Found
        '415':
          description: Unsuported media type
        '500':
          description: Internal Server Error 
    delete:
      tags:
        - filme
      summary: Deleta o filme
      description: Exclui o registro de um filme correspondente ao Id
      parameters:
        - name: id
          in: path
          description: Id correspondente ao filme
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successful Operation
        '400':
          description: Invalid Input
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
          

