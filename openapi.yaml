components:
  schemas:
    Filme:
      required:
      - nome
      - duracao
      - capa
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        sinopse:
          type: string
        data_lancamento:
          type: string
          format: date
        duracao:
          type: string
          format: date-time
        orcamento:
          type: number
          format: float
        trailer:
          type: string
        capa:
          type: string
    Formato:
      required:
      - nome
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        descricao:
          type: string
    Genero:
      required:
      - nome
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
    Idioma:
      required:
        - nome
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
    Plataforma:
      required:
        - nome
        - preco
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        preco:
          type: number
          format: float
        site:
          type: string
    Classificacao:
      required:
        - nivel
        - descricao
      type: object
      properties:
        id:
          type: integer
        nivel:
          type: string
        descricao:
          type: string
  requestBodies:
    Filme:
      description: Objeto que deve ser enviado no Body das requisicoes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Filme'
    Formato:
      description: Objeto que deve ser enviado no Body das requisicoes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Filme'
    Genero:
      description: Objeto que deve ser enviado no Body das requisicoes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Genero'
    Idioma:
      description: Objeto que deve ser enviado no Body das requisicoes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Idioma'
    Plataforma:
      description: Objeto que deve ser enviado no Body das requisicoes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Plataforma'
    Classificacao:
      description: Objeto que deve ser enviado no Body das requisicoes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Classificacao'
    